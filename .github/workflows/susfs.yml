# ============================================================
#
# Lanjutan dari Fase 1 (build-kernel-ksu-v2.yml) yang SUDAH TERBUKTI
# BOOT NORMAL.
#
# ReSukiSU diintegrasikan lewat setup.sh RESMI (https://github.com/ReSukiSU/ReSukiSU,
# tanpa argumen branch = checkout "main", sesuai README repo - branch "auto-hook"
# yang dipakai sebelumnya SUDAH DIHAPUS dari workflow ini). Untuk kernel 4.14
# (non-GKI, < 5.10) dipakai CONFIG_KSU_MANUAL_HOOK=y, karena Tracepoint Syscall
# Redirect hanya didukung GKI2 5.10+.
#
# RE-VERIFIKASI 26 Agustus 2026 (ulang, terhadap docs resmi resukisu.github.io/
# guide/manual-integrate.html, edit terakhir "3 hari lalu" pada saat cek): SEMUA
# enam hook manual di bawah (execveat, faccessat, stat/newfstat/fstat64, sys_reboot)
# signature dan titik sisipnya PERSIS SAMA dengan versi resmi terkini di docs.
# Khusus execveat: docs punya DUA varian - varian resmi "3.14+" yang menyisipkan
# ksu_handle_execveat ke DALAM do_execveat_common (dipakai workflow ini), dan
# varian "Deprecated" yang menyisipkan ke do_execve/compat_do_execve (secara
# eksplisit ditandai docs: "NOT recommended... Android 17 QPR2+"). Workflow ini
# sudah pakai varian yang BENAR (bukan yang deprecated). Docs resmi juga
# menambahkan atribut compiler `__attribute__((hot))` pada extern declaration
# ksu_handle_execveat dan ksu_handle_faccessat (hint optimasi branch-prediction,
# BUKAN syarat kompilasi) - sudah ditambahkan di step di bawah supaya 100%
# verbatim dengan referensi resmi.
#
# Docs resmi juga mengonfirmasi: kalau CONFIG_KALLSYMS_ALL=y (sudah diaktifkan
# eksplisit di defconfig, lihat step "Aktifkan KSU + SUSFS di defconfig"), seluruh
# patch "Static symbol export" (hapus `static` dari write_op, sel_handle_
# status_ops, selinux_ops, dst. di security/selinux/*.c) TIDAK diperlukan -
# ReSukiSU hanya mewajibkan symbol-export manual itu kalau KALLSYMS_ALL mati.
# Workflow ini sudah benar tidak menyentuh security/selinux/*.c dari sisi
# ReSukiSU sendiri (SUSFS punya patch terpisah ke file yang sama, lihat catatan
# 1 September 2026 di bawah).
#
# Source resmi branch main TIDAK punya auto_hook_detect.mk/auto_hook.c (itu
# spesifik branch auto-hook yang sudah tidak dipakai). kernel/Kbuild resmi
# meng-include kernel/tools/manual_hook_check.mk yang HARD-FAIL saat compile
# kalau simbol hook tidak ditemukan persis di source - tidak ada fallback
# otomatis. Tiga hook (setuid/init-rc/input) tetap otomatis lewat LSM karena
# CONFIG_KSU_MANUAL_HOOK_AUTO_SETUID_HOOK/AUTO_INITRC_HOOK/AUTO_INPUT_HOOK
# default=y di Kconfig resmi (kernel 4.14 < 6.8, jadi valid dipakai, dan
# dikonfirmasi ulang persis sesuai docs resmi: "For kernel 6.8 (not included
# 6.8) and below, this hook can be automatically applied via LSM"). Sisanya
# (execveat, faccessat, stat, newfstat_ret, fstat64_ret, sys_reboot) DIPATCH
# MANUAL ke fs/exec.c, fs/open.c, fs/stat.c, kernel/reboot.c - setiap anchor
# sudah diverifikasi baris-per-baris terhadap source dlagia/android_kernel_
# xiaomi_rosemary@rosemary-13 sebelum ditanam di sini (lihat step di bawah).
#
# RE-VERIFIKASI 24 Agustus 2026: dicek ulang langsung ke source main branch
# ReSukiSU HARI INI (commit b2ac2fc "kernel: filter kernel modules at load
# time"). Komit terbaru itu sepenuhnya self-contained (file baru feature/
# module_load_filter.c/.h + registrasi via kernelsu_init()/_exit() milik
# ReSukiSU sendiri) - TIDAK menyentuh manual_hook_check.mk, sucompat.c,
# atau supercall.c, jadi TIDAK ADA dampak ke hook manual kita di fs/exec.c,
# fs/open.c, fs/stat.c, kernel/reboot.c. Juga dicek ulang PR upstream
# tiann/KernelSU #3521 (refactor sucompat) dan #3639 (handle execveat utk
# bionic baru) yang sudah ter-cherry-pick sebelumnya - signature
# ksu_handle_execveat/faccessat/stat dan syarat "manual hook harus panggil
# ksu_handle_execveat dari dalam do_execveat_common" TETAP SAMA PERSIS
# dengan yang dipakai di patch fs/exec.c. Tidak ada perubahan yang diperlukan.
#
# RE-VERIFIKASI 26 Agustus 2026: ada commit upstream yang menyentuh
# kernel/feature/sucompat.c (03b60f2), tapi build ini TIDAK memakai fitur
# opsional apa pun yang dipengaruhi commit tsb - signature
# `ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *__unused_flags)`
# dan `ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags)`
# TETAP SAMA, identik dengan extern declaration di patch fs/open.c dan
# fs/stat.c kita - tidak ada perubahan yang diperlukan di sisi workflow ini.
#
# RE-VERIFIKASI 27 Agustus 2026: dicek ulang aktivitas branch main ReSukiSU
# hari ini - ada PR upstream #361 ("kernel: sync with latest susfs") yang
# MASIH TERBUKA (belum di-merge ke main, masih tahap CI synchronize). Karena
# BELUM merge, tidak berdampak ke workflow ini sekarang - tapi ini sinyal
# supaya pengecekan sucompat.c diulang lagi pada run berikutnya setelah PR
# tsb merge, sekadar untuk jaga-jaga.
#
# RE-VERIFIKASI 31 Agustus 2026 (permintaan eksplisit): Re:Kernel
# (Sakion-Team/Re-Kernel) dan Baseband-guard (vc-teahouse/Baseband-guard)
# SUDAH DIHAPUS TOTAL dari workflow ini - baik step integrasinya, file
# driver/rekernel/* dan drivers/Makefile+Kconfig entry-nya, hook Perl ke
# binder.c/binder_alloc.c/kernel/signal.c, include header rekernel.h di
# ketiga file itu, baris CONFIG_REKERNEL=y dan CONFIG_BBG=y di defconfig,
# verifikasi CONFIG_REKERNEL/CONFIG_BBG resolved di step compile, maupun
# nama file zip hasil build yang sebelumnya menyebut "rekernel-bbg". Kernel
# hasil build ini TIDAK lagi membuka netlink server freeze-notifier Re:Kernel
# dan TIDAK lagi memuat LSM anti-tulis baseband/boot chain Baseband-guard.
# Semua referensi ke kedua proyek itu di komentar lama pun sudah dibuang
# supaya tidak ada residu dokumentasi yang menyesatkan pembaca berikutnya.
#
# CATATAN (permintaan eksplisit): penambalan CVE-2026-43499 (GhostLock,
# rtmutex/futex UAF -> local root exploit) yang sebelumnya ada di workflow
# ini SUDAH DIHAPUS TOTAL atas permintaan langsung - baik step-nya, patch
# base64-nya, maupun seluruh referensi ke CVE ini di komentar. Kernel hasil
# build ini TIDAK lagi menyertakan backport fix untuk bug rt_mutex/futex
# remove_waiter() tsb.
#
# CATATAN (permintaan eksplisit, 1 September 2026): step penyelarasan
# SUBLEVEL kernel ke versi stock (4.14.186, berdasarkan temuan versi di
# biner vendor fsck.f2fs), SELURUH integrasi NoMount (maxsteeel/nomount,
# branch dev), dan SELURUH integrasi Droidspaces-OSS (ravindu644/
# Droidspaces-OSS) SUDAH DIHAPUS TOTAL dari workflow ini - baik step-nya
# masing-masing, symlink fs/nomount, entry fs/Kconfig & fs/Makefile terkait
# NoMount, baris CONFIG_NOMOUNT=y di defconfig, verifikasi CONFIG_NOMOUNT
# resolved di step compile, step "Compile nm" (CLI userspace NoMount)
# beserta artifact nm-src/nm, step "Integrasikan Droidspaces-OSS" (patch
# non-GKI), seluruh baris CONFIG_* Droidspaces (namespace/cgroup/seccomp/
# devtmpfs/overlay/tmpfs-acl/firmware-loader/netfilter) di defconfig,
# verifikasi CONFIG fatal Droidspaces & CONFIG_ANDROID_PARANOID_NETWORK di
# step compile, dan seluruh referensi ke NoMount/SUBLEVEL/Droidspaces di
# komentar lama. Kernel hasil build ini TIDAK lagi memakai redirect path VFS
# ala NoMount, TIDAK lagi menyertakan dukungan container Droidspaces, dan
# SUBLEVEL kernel mengikuti nilai asli dari source upstream (tidak lagi
# dipaksa ke 186). Jangan ditambahkan kembali kecuali diminta ulang secara
# eksplisit.
#
# CATATAN (permintaan eksplisit, 1 September 2026): SUSFS ditambahkan,
# mengikuti struktur & skrip resmi JackA1ltman/NonGKI_Kernel_Build_2nd
# (https://github.com/JackA1ltman/NonGKI_Kernel_Build_2nd, branch "sample"
# dicek sebagai referensi struktur folder Patches/). Dua file yang dipakai
# adalah file yang SUDAH di-generate lokal oleh pengguna terhadap commit
# rosemary-13 yang SAMA dengan yang di-clone step "Clone source kernel" di
# bawah: susfs_patch_to_4_14.patch (patch inti SUSFS: fs/susfs.c,
# include/linux/susfs.h, include/linux/susfs_def.h dibuat baru, plus
# modifikasi fs/namei.c, fs/namespace.c, fs/notify/fdinfo.c, fs/proc/*.c,
# fs/proc_namespace.c, fs/readdir.c, fs/stat.c, fs/statfs.c,
# kernel/kallsyms.c, kernel/sys.c, mm/memory.c, security/selinux/avc.c) dan
# susfs_inline_hook_patches.sh (skrip hook tambahan resmi, penulis asli
# patch: simonpunk @ GitLab, backslashxx @ GitHub; shell: JackA1ltman
# @ GitHub - dipakai VERBATIM, tidak dimodifikasi).
#
# PENTING - alasan CONFIG_KSU_SUSFS_SUS_SU dipaksa "n": dikonfirmasi dari
# README resmi gitlab.com/simonpunk/susfs4ksu - "If your kernel already has
# the KSU non-kprobe hook patches applied, then you have to DISABLE the
# CONFIG_KSU_SUSFS_SUS_SU option." Kernel ini SUDAH pakai Manual Hook
# (non-kprobe) dari ReSukiSU di step "Pasang hook manual ReSukiSU" - jadi
# SUS_SU wajib mati. Ini juga konsisten dengan docs resmi ReSukiSU
# (resukisu.github.io) yang membedakan "Manual Hook" dan "SuSFS Inline Hook"
# sebagai DUA metode hook yang TERPISAH/alternatif (bukan untuk ditumpuk) -
# workflow ini tetap pada "Manual Hook" dari ReSukiSU sebagai hook utama,
# dan skrip inline SUSFS HANYA menambahkan hook di file yang belum disentuh
# ReSukiSU (skrip itu sendiri otomatis skip file yang sudah berisi string
# "ksu_handle", lihat guard di baris awal skrip resmi) - lihat komentar di
# step "Terapkan SUSFS - inline hook script resmi" di bawah untuk rincian.
#
# PENTING - CONFIG_KSU_MANUAL_HOOK_AUTO_INPUT_HOOK dipaksa "n" (bukan lagi
# "y" seperti sebelumnya) SELAMA CONFIG_KSU_SUSFS=y: per pengecekan langsung
# ke github.com/ReSukiSU/ReSukiSU/issues pada 1 September 2026, ada laporan
# bug yang MASIH OPEN (issue #363, "stop_input_hook() sleeps in atomic
# context with CONFIG_KSU_SUSFS") yang menyatakan hook input ReSukiSU bisa
# memanggil fungsi yang boleh sleep dari dalam context atomic/spinlock
# ketika CONFIG_KSU_SUSFS aktif - berisiko kernel panic "scheduling while
# atomic" di device nyata. Catatan kejujuran: saya (penulis workflow ini)
# BELUM memverifikasi baris kode persis ReSukiSU yang jadi biang masalah
# (sourcenya tidak saya baca detail satu-per-satu untuk fungsi ini) - hanya
# mengandalkan judul+status issue resmi di atas sebagai sinyal risiko nyata
# dan masih berlangsung. Karena itu, AUTO_INPUT_HOOK dimatikan sebagai
# mitigasi aman (konsekuensi: fitur safe-mode kombinasi tombol volume tidak
# aktif). Cek ulang status issue #363 sebelum menyalakan kembali flag ini.
#
# ============================================================

on:
  workflow_dispatch: {}
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repo workflow (sumber Patches/ SUSFS)
        uses: actions/checkout@v4

      - name: Pasang dependency build
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl flex git kmod \
            libelf-dev libssl-dev zip zlib1g-dev xxd \
            libtinfo5 libncurses5 gcc-aarch64-linux-gnu

      - name: Clone source kernel (dlagia/android_kernel_xiaomi_rosemary @ rosemary-13)
        run: |
          git clone --depth=1 -b rosemary-13 \
            https://github.com/dlagia/android_kernel_xiaomi_rosemary.git kernel-src

      - name: Integrasikan ReSukiSU (setup.sh resmi, branch main)
        working-directory: kernel-src
        run: |
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash

          test -d KernelSU || {
            echo "ERROR: direktori KernelSU tidak ditemukan"
            exit 1
          }

          echo "== ReSukiSU branch =="
          cd KernelSU
          git branch --show-current
          git rev-parse --short HEAD
          test "$(git branch --show-current)" = "main" || {
            echo "ERROR: ReSukiSU bukan branch main (setup.sh resmi tanpa argumen harus checkout main)"
            exit 1
          }
          cd ..

          test -L drivers/kernelsu || {
            echo "ERROR: symlink drivers/kernelsu tidak dibuat oleh setup.sh"
            exit 1
          }
          grep -q 'obj-$(CONFIG_KSU) += kernelsu/' drivers/Makefile || {
            echo "ERROR: drivers/Makefile tidak berisi entry kernelsu/"
            exit 1
          }
          grep -q 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig || {
            echo "ERROR: drivers/Kconfig tidak berisi source kernelsu/Kconfig"
            exit 1
          }

          echo "ReSukiSU main (resmi): OK"
          ls -ld KernelSU drivers/kernelsu

      - name: Pasang hook manual ReSukiSU (kernel 4.14, non-GKI)
        working-directory: kernel-src
        run: |
          python3 - << 'PYEOF'
          import sys

          def patch(path, replacements):
              with open(path, "r") as f:
                  s = f.read()
              for old, new, label in replacements:
                  n = s.count(old)
                  if n != 1:
                      print(f"ERROR: anchor '{label}' di {path} ditemukan {n}x (harus persis 1x)")
                      sys.exit(1)
                  s = s.replace(old, new, 1)
              with open(path, "w") as f:
                  f.write(s)
              print(f"{path}: OK")

          # ---------- fs/exec.c: ksu_handle_execveat ----------
          exec_decl_old = (
              "static int do_execveat_common(int fd, struct filename *filename,\n"
              "\t\t\t      struct user_arg_ptr argv,\n"
              "\t\t\t      struct user_arg_ptr envp,\n"
              "\t\t\t      int flags)\n{\n\tchar *pathbuf = NULL;"
          )
          exec_decl_new = (
              "#ifdef CONFIG_KSU\n"
              "__attribute__((hot))\n"
              "extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv,\n"
              "\t\t\t\tvoid *envp, int *flags);\n"
              "#endif\n\n"
          ) + exec_decl_old
          exec_body_old = (
              "\tint retval;\n\n\tif (IS_ERR(filename))\n\t\treturn PTR_ERR(filename);"
          )
          exec_body_new = (
              "\tint retval;\n\n"
              "#ifdef CONFIG_KSU\n"
              "\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n"
              "#endif\n\n"
              "\tif (IS_ERR(filename))\n\t\treturn PTR_ERR(filename);"
          )
          patch("fs/exec.c", [
              (exec_decl_old, exec_decl_new, "do_execveat_common signature"),
              (exec_body_old, exec_body_new, "do_execveat_common body"),
          ])

          # ---------- fs/open.c: ksu_handle_faccessat ----------
          open_old = (
              "SYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename, int, mode)\n"
              "{\n\tconst struct cred *old_cred;\n\tstruct cred *override_cred;\n"
              "\tstruct path path;\n\tstruct inode *inode;\n\tstruct vfsmount *mnt;\n"
              "\tint res;\n\tunsigned int lookup_flags = LOOKUP_FOLLOW;\n\n"
              "\tif (mode & ~S_IRWXO)\t/* where's F_OK, X_OK, W_OK, R_OK? */\n"
              "\t\treturn -EINVAL;"
          )
          open_new = (
              "#ifdef CONFIG_KSU\n"
              "__attribute__((hot))\n"
              "extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode,\n"
              "\t\t\t\t int *flags);\n#endif\n\n"
              "SYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename, int, mode)\n"
              "{\n\tconst struct cred *old_cred;\n\tstruct cred *override_cred;\n"
              "\tstruct path path;\n\tstruct inode *inode;\n\tstruct vfsmount *mnt;\n"
              "\tint res;\n\tunsigned int lookup_flags = LOOKUP_FOLLOW;\n\n"
              "#ifdef CONFIG_KSU\n\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n#endif\n\n"
              "\tif (mode & ~S_IRWXO)\t/* where's F_OK, X_OK, W_OK, R_OK? */\n"
              "\t\treturn -EINVAL;"
          )
          patch("fs/open.c", [(open_old, open_new, "SYSCALL_DEFINE3(faccessat...)")])

          # ---------- fs/stat.c: ksu_handle_stat + newfstat_ret + fstat64_ret ----------
          stat_extern = (
              "#ifdef CONFIG_KSU\n"
              "extern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);\n"
              "extern void ksu_handle_newfstat_ret(unsigned int *fd, struct stat __user **statbuf_ptr);\n"
              "#if defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_COMPAT_STAT64)\n"
              "extern void ksu_handle_fstat64_ret(unsigned long *fd, struct stat64 __user **statbuf_ptr);\n"
              "#endif\n#endif\n\n"
          )
          newfstatat_old = (
              "SYSCALL_DEFINE4(newfstatat, int, dfd, const char __user *, filename,\n"
              "\t\tstruct stat __user *, statbuf, int, flag)\n{\n\tstruct kstat stat;\n"
              "\tint error;\n\n\terror = vfs_fstatat(dfd, filename, &stat, flag);"
          )
          newfstatat_new = stat_extern + (
              "SYSCALL_DEFINE4(newfstatat, int, dfd, const char __user *, filename,\n"
              "\t\tstruct stat __user *, statbuf, int, flag)\n{\n\tstruct kstat stat;\n"
              "\tint error;\n\n"
              "#ifdef CONFIG_KSU\n\tksu_handle_stat(&dfd, &filename, &flag);\n#endif\n\n"
              "\terror = vfs_fstatat(dfd, filename, &stat, flag);"
          )
          newfstat_old = (
              "SYSCALL_DEFINE2(newfstat, unsigned int, fd, struct stat __user *, statbuf)\n"
              "{\n\tstruct kstat stat;\n\tint error = vfs_fstat(fd, &stat);\n\n"
              "\tif (!error)\n\t\terror = cp_new_stat(&stat, statbuf);\n\n\treturn error;\n}"
          )
          newfstat_new = (
              "SYSCALL_DEFINE2(newfstat, unsigned int, fd, struct stat __user *, statbuf)\n"
              "{\n\tstruct kstat stat;\n\tint error = vfs_fstat(fd, &stat);\n\n"
              "\tif (!error)\n\t\terror = cp_new_stat(&stat, statbuf);\n\n"
              "#ifdef CONFIG_KSU\n\tif (!error)\n\t\tksu_handle_newfstat_ret(&fd, &statbuf);\n#endif\n\n"
              "\treturn error;\n}"
          )
          fstat64_old = (
              "SYSCALL_DEFINE2(fstat64, unsigned long, fd, struct stat64 __user *, statbuf)\n"
              "{\n\tstruct kstat stat;\n\tint error = vfs_fstat(fd, &stat);\n\n"
              "\tif (!error)\n\t\terror = cp_new_stat64(&stat, statbuf);\n\n\treturn error;\n}"
          )
          fstat64_new = (
              "SYSCALL_DEFINE2(fstat64, unsigned long, fd, struct stat64 __user *, statbuf)\n"
              "{\n\tstruct kstat stat;\n\tint error = vfs_fstat(fd, &stat);\n\n"
              "\tif (!error)\n\t\terror = cp_new_stat64(&stat, statbuf);\n\n"
              "#ifdef CONFIG_KSU\n\tif (!error)\n\t\tksu_handle_fstat64_ret(&fd, &statbuf);\n#endif\n\n"
              "\treturn error;\n}"
          )
          patch("fs/stat.c", [
              (newfstatat_old, newfstatat_new, "SYSCALL_DEFINE4(newfstatat...) + extern block"),
              (newfstat_old, newfstat_new, "SYSCALL_DEFINE2(newfstat...)"),
              (fstat64_old, fstat64_new, "SYSCALL_DEFINE2(fstat64...)"),
          ])

          # ---------- kernel/reboot.c: ksu_handle_sys_reboot (ReSukiSU supercall) ----------
          reboot_old = (
              "SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd,\n"
              "\t\tvoid __user *, arg)\n{\n"
              "\tstruct pid_namespace *pid_ns = task_active_pid_ns(current);\n"
              "\tchar buffer[256];\n\tint ret = 0;\n\n"
              "\t/* We only trust the superuser with rebooting the system. */"
          )
          reboot_new = (
              "#ifdef CONFIG_KSU\n"
              "extern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);\n"
              "#endif\n\n"
              "SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd,\n"
              "\t\tvoid __user *, arg)\n{\n"
              "\tstruct pid_namespace *pid_ns = task_active_pid_ns(current);\n"
              "\tchar buffer[256];\n\tint ret = 0;\n\n"
              "#ifdef CONFIG_KSU\n"
              "\t/* ReSukiSU supercall: manager pasang fd komunikasi lewat syscall reboot()\n"
              "\t * dengan magic1/magic2 khusus KSU (BUKAN LINUX_REBOOT_MAGIC*).\n"
              "\t * ksu_handle_sys_reboot() sendiri sudah memvalidasi magic1 dan\n"
              "\t * mengembalikan -EINVAL kalau bukan supercall - reboot asli tak terpengaruh. */\n"
              "\tif (!ksu_handle_sys_reboot(magic1, magic2, cmd, &arg))\n\t\treturn 0;\n"
              "#endif\n\n"
              "\t/* We only trust the superuser with rebooting the system. */"
          )
          patch("kernel/reboot.c", [(reboot_old, reboot_new, "SYSCALL_DEFINE4(reboot...)")])
          PYEOF

          echo ""
          echo "== Verifikasi simbol hook manual tertanam =="
          for pair in \
            "fs/exec.c:ksu_handle_execveat" \
            "fs/open.c:ksu_handle_faccessat" \
            "fs/stat.c:ksu_handle_stat" \
            "fs/stat.c:ksu_handle_newfstat_ret" \
            "fs/stat.c:ksu_handle_fstat64_ret" \
            "kernel/reboot.c:ksu_handle_sys_reboot"; do
            f="${pair%%:*}"; sym="${pair##*:}"
            grep -q "$sym" "$f" || { echo "ERROR: $sym tidak ditemukan di $f"; exit 1; }
            echo "OK: $sym -> $f"
          done

      - name: Terapkan SUSFS - patch inti kernel (susfs_patch_to_4_14.patch)
        working-directory: kernel-src
        run: |
          PATCH="$GITHUB_WORKSPACE/Patches/susfs_patch_to_4_14.patch"
          test -f "$PATCH" || {
            echo "ERROR: $PATCH tidak ditemukan."
            echo "Taruh file susfs_patch_to_4_14.patch (hasil generate lokal"
            echo "pengguna terhadap SATU commit dlagia/android_kernel_xiaomi_"
            echo "rosemary@rosemary-13 yang SAMA dengan step 'Clone source"
            echo "kernel' di atas) di path Patches/susfs_patch_to_4_14.patch"
            echo "pada repo yang meng-host workflow ini, mengikuti struktur"
            echo "folder resmi JackA1ltman/NonGKI_Kernel_Build_2nd."
            exit 1
          }

          echo "== Dry-run (git apply --check) =="
          if ! git apply --check --whitespace=nowarn "$PATCH" 2>/tmp/susfs-core-check.log; then
            echo "ERROR: susfs_patch_to_4_14.patch GAGAL apply (hunk reject)."
            echo "Kemungkinan besar: patch ini di-generate terhadap commit"
            echo "rosemary-13 yang BEDA dengan commit yang ter-clone hari ini"
            echo "(tidak seperti hook ReSukiSU di atas yang menempel ke"
            echo "signature fungsi resmi KernelSU/SUSFS, patch SUSFS ini"
            echo "menempel ke baris kode PERSIS milik kernel rosemary - kalau"
            echo "source upstream rosemary-13 berubah walau 1 baris di salah"
            echo "satu dari 18 file yang disentuh, hunk-nya bisa reject dan"
            echo "patch ini WAJIB di-generate ulang oleh pengguna, bukan"
            echo "ditambal manual di CI)."
            echo "== Isi log git apply --check =="
            cat /tmp/susfs-core-check.log
            exit 1
          fi

          git apply --whitespace=nowarn "$PATCH"
          echo "susfs_patch_to_4_14.patch: APPLIED OK"

          echo ""
          echo "== Verifikasi file inti SUSFS tertanam =="
          for f in fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h; do
            test -f "$f" || { echo "ERROR: $f tidak dibuat oleh patch"; exit 1; }
            echo "OK: $f ada"
          done
          grep -q 'obj-$(CONFIG_KSU_SUSFS) += susfs.o' fs/Makefile || {
            echo "ERROR: fs/Makefile tidak berisi entry build susfs.o"
            exit 1
          }
          echo "OK: fs/Makefile sudah punya entry susfs.o"

      - name: Terapkan SUSFS - inline hook script resmi (susfs_inline_hook_patches.sh)
        working-directory: kernel-src
        run: |
          SCRIPT="$GITHUB_WORKSPACE/Patches/susfs_inline_hook_patches.sh"
          test -f "$SCRIPT" || {
            echo "ERROR: $SCRIPT tidak ditemukan."
            echo "Taruh file susfs_inline_hook_patches.sh (skrip resmi dari"
            echo "JackA1ltman/NonGKI_Kernel_Build_2nd - penulis asli patch:"
            echo "simonpunk @ GitLab & backslashxx @ GitHub) di path"
            echo "Patches/susfs_inline_hook_patches.sh."
            exit 1
          }
          cp "$SCRIPT" ./susfs_inline_hook_patches.sh
          chmod +x ./susfs_inline_hook_patches.sh

          echo "== Menjalankan skrip resmi (verbatim, TIDAK dimodifikasi) =="
          bash ./susfs_inline_hook_patches.sh 2>&1 | tee /tmp/susfs-hook.log

          echo ""
          echo "== PENTING: baca ini kalau lihat '[-] Warning: ... contains KernelSU' di atas =="
          echo "Untuk fs/exec.c, fs/open.c, fs/stat.c, dan kernel/reboot.c,"
          echo "skrip resmi di atas SENGAJA melewati file yang sudah berisi"
          echo "string 'ksu_handle' (guard bawaan skrip resmi ini sendiri,"
          echo "lihat baris 'if grep -q \"ksu_handle\" ...' di awal skrip)."
          echo "Keempat file itu SUDAH dipatch step 'Pasang hook manual"
          echo "ReSukiSU' di atas (execveat/faccessat/stat/reboot dasar)."
          echo "Dilewatinya file itu di sini BUKAN kegagalan/bug, melainkan"
          echo "perilaku resmi yang didokumentasikan susfs4ksu: 'If your"
          echo "kernel already has the KSU non-kprobe hook patches applied,"
          echo "then you have to DISABLE the CONFIG_KSU_SUSFS_SUS_SU"
          echo "option' - dan itu sudah dipaksa n di step defconfig berikutnya."

          echo ""
          echo "== Verifikasi hook TAMBAHAN dari skrip (di file yang BELUM disentuh ReSukiSU) =="
          for pair in \
            "fs/namei.c:int filename_lookup(int dfd" \
            "fs/read_write.c:ksu_handle_sys_read" \
            "security/selinux/hooks.c:security_secid_to_secctx" \
            "kernel/sys.c:ksu_handle_setresuid" \
            "drivers/input/input.c:ksu_handle_input_handle_event" \
            "include/linux/seccomp.h:filter_count"; do
            f="${pair%%:*}"; needle="${pair#*:}"
            if grep -qF "$needle" "$f"; then
              echo "OK: '$needle' -> $f"
            else
              echo "INFO: '$needle' tidak ditemukan di $f - skrip resmi sudah"
              echo "      mencetak alasannya sendiri di log di atas (mis."
              echo "      fork KernelSU yang dipakai tidak punya simbol"
              echo "      terkait, atau kondisi versi kernel tidak terpenuhi)."
              echo "      Ini ditangani secara non-fatal oleh skrip resmi,"
              echo "      TIDAK menghentikan build."
            fi
          done

          rm -f ./susfs_inline_hook_patches.sh

      - name: Commit ReSukiSU + bersihkan dirty
        working-directory: kernel-src
        run: |
          echo "==================== Cek status KernelSU sebelum commit ===================="
          cd KernelSU
          git status --porcelain || true
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -A
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "Apply custom integration (remove dirty)"
            echo "Commit berhasil dilakukan di KernelSU"
          else
            echo "KernelSU sudah clean, tidak ada yang perlu di-commit"
          fi

          echo ""
          echo "==================== Status setelah commit ===================="
          git status
          git diff-index --quiet HEAD && echo ">>> KernelSU CLEAN (tidak ada dirty)" || echo ">>> MASIH DIRTY!"

          cd ..

          if [ -f scripts/setlocalversion ]; then
            sed -i 's/-dirty//g' scripts/setlocalversion
            echo "scripts/setlocalversion sudah dibersihkan dari -dirty"
          fi

          find . -name setlocalversion -exec sed -i 's/-dirty//g' {} + 2>/dev/null || true

          if [ -f KernelSU/kernel/Kbuild ]; then
            sed -i 's/KSU_COMMIT_SHA  := \$(KSU_COMMIT_SHA)-dirty/KSU_COMMIT_SHA  := \$(KSU_COMMIT_SHA)/' KernelSU/kernel/Kbuild || true
            echo "Pengecekan -dirty di KernelSU/kernel/Kbuild sudah dinetralisir"
          fi

      - name: Pra-compile - perbaikan build source MTK (verified reusable)
        working-directory: kernel-src
        run: |
          grep -rlZ --include=Makefile --include=Kbuild --include='*.mk' -e '-Werror' . 2>/dev/null \
            | xargs -0 -r sed -i -E -e 's/-Werror=[A-Za-z0-9_-]+//g' -e 's/(-Werror)([[:space:]]|$)/\2/g' || true
          grep -rlZ 'no_sanitize(' . 2>/dev/null \
            | xargs -0 -r sed -i -E 's/__attribute__\(\(no_sanitize\("[^"]*"\)\)\)//g' || true
          sed -i 's/inline void ksm_flock(/void ksm_flock(/' include/linux/keyslot-manager.h block/keyslot-manager.c || true
          sed -i 's/^inline void blk_crypto_flock(/void blk_crypto_flock(/' include/linux/blk-crypto.h block/blk-crypto.c || true
          sed -i 's/inline int typec_pd_start_entry(/int typec_pd_start_entry(/' drivers/misc/mediatek/typec/tcpc/inc/tcpci_typec.h drivers/misc/mediatek/typec/tcpc/tcpci_typec.c || true
          find drivers/input/touchscreen -name focaltech_config.h -printf '%h\n' 2>/dev/null | while read d; do
            mkdir -p "$d/include/firmware"
            printf '0x00\n' > "$d/include/firmware/fw_sample.i"
            echo "stub firmware -> $d/include/firmware/fw_sample.i"
          done
          grep -rl 'bq2597x_charger.o' --include=Makefile . 2>/dev/null | while read mk; do
            echo 'CFLAGS_REMOVE_bq2597x_charger.o += -mgeneral-regs-only' >> "$mk"
            echo "CFLAGS_REMOVE ditambah ke: $mk"
          done
          echo '== cek sisa =='
          echo -n 'no_sanitize( tersisa: '; grep -rl 'no_sanitize(' --include='*.h' --include='*.c' . 2>/dev/null | wc -l

      - name: Aktifkan KSU + SUSFS di defconfig
        working-directory: kernel-src
        run: |
          DEF=arch/arm64/configs/rosemary_defconfig
          {
            echo ""
            echo 'CONFIG_LOCALVERSION="-perf"'
            echo "CONFIG_LOCALVERSION_AUTO=n"
            echo ""
            echo "CONFIG_KSU=y"
            echo "CONFIG_KSU_TRACEPOINT_HOOK=n"
            echo "CONFIG_KSU_MANUAL_HOOK=y"
            echo "CONFIG_KALLSYMS=y"
            echo "CONFIG_KALLSYMS_ALL=y"
            echo "CONFIG_KSU_MANUAL_HOOK_AUTO_SETUID_HOOK=y"
            echo "CONFIG_KSU_MANUAL_HOOK_AUTO_INITRC_HOOK=y"
            echo ""
            echo "# ---- SUSFS (JackA1ltman/NonGKI_Kernel_Build_2nd) ----"
            echo "CONFIG_KSU_SUSFS=y"
            echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=n"
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y"
            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y"
            echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y"
            echo "CONFIG_KSU_SUSFS_SUS_OVERLAYFS=n"
            echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y"
            echo "CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y"
            echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y"
            echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y"
            echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y"
            echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y"
            echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y"
            echo ""
            echo "# WAJIB n: kernel ini pakai Manual Hook (non-kprobe) di"
            echo "# atas, bukan kprobe. SUS_SU dirancang untuk MENGGANTI"
            echo "# hook kprobe dengan binary su klasik userspace - konflik"
            echo "# konsep dengan manual hook yang sudah aktif. Dikonfirmasi"
            echo "# dari README resmi gitlab.com/simonpunk/susfs4ksu:"
            echo "# 'If your kernel already has the KSU non-kprobe hook"
            echo "# patches applied, then you have to DISABLE the"
            echo "# CONFIG_KSU_SUSFS_SUS_SU option.'"
            echo "CONFIG_KSU_SUSFS_SUS_SU=n"
            echo ""
            echo "# WAJIB n (mitigasi bug live upstream, dicek 1 Sept 2026):"
            echo "# ReSukiSU issue #363 'stop_input_hook() sleeps in atomic"
            echo "# context with CONFIG_KSU_SUSFS' MASIH OPEN saat baris ini"
            echo "# ditulis. Kombinasi AUTO_INPUT_HOOK=y + CONFIG_KSU_SUSFS=y"
            echo "# berisiko memicu might_sleep() di dalam context"
            echo "# atomic/spinlock input_handle_event() -> kernel panic"
            echo "# 'scheduling while atomic' di perangkat nyata. Baris ini"
            echo "# MENGGANTIKAN nilai 'y' untuk key yang sama di blok KSU"
            echo "# dasar di atas (defconfig: baris terakhir untuk key yang"
            echo "# sama yang menang). Konsekuensi: fitur safe-mode lewat"
            echo "# kombinasi tombol volume TIDAK aktif selama flag ini n."
            echo "# Nyalakan lagi HANYA setelah cek ulang status issue #363"
            echo "# (github.com/ReSukiSU/ReSukiSU/issues) sudah di-fix."
            echo "CONFIG_KSU_MANUAL_HOOK_AUTO_INPUT_HOOK=n"
            echo ""
          } >> "$DEF"
          tail -50 "$DEF"

      - name: Ambil toolchain proton-clang (dipakai penulis kernel ini di b.sh)
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang-proton

      - name: Compile kernel
        working-directory: kernel-src
        run: |
          export PATH="$GITHUB_WORKSPACE/clang-proton/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER=build
          export KBUILD_BUILD_HOST=kernel
          export KBUILD_BUILD_TIMESTAMP="Mon Jul  1 17:32:55 CST 2024"
          make O=out rosemary_defconfig

          echo ""
          echo "==================== RESOLVED ReSukiSU + SUSFS CONFIG ===================="
          grep -E '^(CONFIG_KSU|CONFIG_KALLSYMS)' out/.config || true

          grep -q '^CONFIG_KSU=y$' out/.config || { echo "ERROR: CONFIG_KSU tidak resolve ke y"; exit 1; }
          grep -q '^CONFIG_KSU_MANUAL_HOOK=y$' out/.config || { echo "ERROR: CONFIG_KSU_MANUAL_HOOK tidak resolve ke y"; exit 1; }
          grep -q '^CONFIG_KALLSYMS=y$' out/.config || { echo "ERROR: CONFIG_KALLSYMS tidak resolve ke y"; exit 1; }
          grep -q '^CONFIG_KALLSYMS_ALL=y$' out/.config || { echo "ERROR: CONFIG_KALLSYMS_ALL tidak resolve ke y"; exit 1; }

          if grep -q '^CONFIG_KSU_TRACEPOINT_HOOK=y$' out/.config; then
            echo "ERROR: CONFIG_KSU_TRACEPOINT_HOOK=y aktif; kernel 4.14 harus memakai Manual Hook"
            exit 1
          fi

          grep -q '^CONFIG_KSU_SUSFS=y$' out/.config || {
            echo "ERROR: CONFIG_KSU_SUSFS tidak resolve ke y - cek apakah Kconfig"
            echo "ReSukiSU yang ter-checkout hari ini masih punya simbol ini,"
            echo "dan cek isi arch/arm64/configs/rosemary_defconfig."
            exit 1
          }

          if grep -q '^CONFIG_KSU_SUSFS_SUS_SU=y$' out/.config; then
            echo "ERROR: CONFIG_KSU_SUSFS_SUS_SU=y aktif - WAJIB n di kernel"
            echo "manual-hook (non-kprobe) ini. Lihat komentar di step"
            echo "'Aktifkan KSU + SUSFS di defconfig' untuk alasannya."
            exit 1
          fi

          if grep -q '^CONFIG_KSU_MANUAL_HOOK_AUTO_INPUT_HOOK=y$' out/.config; then
            echo "ERROR: CONFIG_KSU_MANUAL_HOOK_AUTO_INPUT_HOOK=y aktif"
            echo "bersamaan dengan CONFIG_KSU_SUSFS=y - kombinasi ini kena"
            echo "bug live upstream ReSukiSU issue #363 (stop_input_hook"
            echo "sleeps in atomic context). Wajib n sampai issue itu di-fix"
            echo "upstream. Lihat komentar di step 'Aktifkan KSU + SUSFS di"
            echo "defconfig'."
            exit 1
          fi

          echo "ReSukiSU Manual Hook + SUSFS: CONFIG OK"
          echo ""
          echo "== Resolved SUSFS sub-feature config (informasional) =="
          grep '^CONFIG_KSU_SUSFS' out/.config || true

          set -o pipefail
          if ! make -k O=out -j"$(nproc)" \
                ARCH=arm64 \
                CC=clang \
                AR=llvm-ar \
                NM=llvm-nm \
                OBJCOPY=llvm-objcopy \
                OBJDUMP=llvm-objdump \
                STRIP=llvm-strip \
                CROSS_COMPILE=aarch64-linux-gnu- \
                CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
                CONFIG_SECTION_MISMATCH_WARN_ONLY=y \
                KCFLAGS="-Wno-error" 2>&1 | tee /tmp/build.log; then
            echo ""
            echo "==================== BARIS ERROR (kirim ini) ===================="
            grep -niE "error:|fatal error|undefined reference|No such file|multiple definition|recipe for target|Error [0-9]" /tmp/build.log | tail -120 || true
            echo "==================== KONTEKS TIAP KEGAGALAN (kirim ini juga) ===================="
            for L in $(grep -n 'Error 1' /tmp/build.log | head -3 | cut -d: -f1); do
              S=$((L-40)); [ $S -lt 1 ] && S=1
              echo "----- konteks baris $S s/d $L -----"
              sed -n "${S},${L}p" /tmp/build.log
            done
            echo "==================== 50 BARIS TERAKHIR ===================="
            tail -50 /tmp/build.log
            echo ""
            echo ">>> BUILD GAGAL. Salin blok BARIS ERROR di atas dan kirim balik."
            exit 1
          fi
          ls -la out/arch/arm64/boot/

          # PERBAIKAN (ditemukan dari laporan pengguna sungguhan - artifact
          # zip tidak berisi file .config sama sekali walau sudah
          # dikonfirmasi ADA saat compile via grep di step ini): akar
          # masalahnya adalah `actions/upload-artifact` (via @actions/glob
          # di baliknya) SECARA DEFAULT tidak menyertakan file yang namanya
          # diawali titik ("dotfile"/hidden file di konvensi Unix) - bukan
          # bug workflow kita di sisi compile, tapi keterbatasan tool
          # upload GitHub sendiri. Solusinya: copy .config ke nama file
          # TANPA titik di depan supaya pasti ikut ter-upload, lalu
          # referensikan nama BARU itu di step "Upload paket" di bawah
          # (bukan lagi kernel-src/out/.config langsung).
          cp out/.config out/resolved-config.txt
          echo "OK: out/.config disalin ke out/resolved-config.txt (nama tanpa titik-di-depan) supaya lolos filter hidden-file upload-artifact"
          echo ""
          echo "==================== VERIFIKASI MANUAL HOOK (resmi) ===================="
          grep -iE "resukisu.*manual_hook|using manual hook|using a manual|using lsm hooks" /tmp/build.log || true

      - name: Tentukan file kernel hasil
        id: kimg
        run: |
          FOUND=""
          for f in Image.gz-dtb Image.gz Image; do
            p="kernel-src/out/arch/arm64/boot/$f"
            if [ -f "$p" ]; then
              echo "path=$p" >> "$GITHUB_OUTPUT"
              echo "name=$f" >> "$GITHUB_OUTPUT"
              FOUND=1
              break
            fi
          done
          [ -n "$FOUND" ] || { echo "Kernel image tidak ditemukan"; exit 1; }
          DTBO="kernel-src/out/arch/arm64/boot/dtbo.img"
          if [ -f "$DTBO" ]; then
            echo "dtbo=$DTBO" >> "$GITHUB_OUTPUT"
            echo "dtbo.img ditemukan: $DTBO"
          fi

      - name: Rakit paket AnyKernel3 (template asli fjrXTR)
        run: |
          git clone --depth=1 https://github.com/fjrXTR/AnyKernel3.git AnyKernel3
          rm -rf AnyKernel3/.git

          echo "" | base64 -d > AnyKernel3/anykernel.sh
          echo "== anykernel.sh =="; cat AnyKernel3/anykernel.sh

          cp "${{ steps.kimg.outputs.path }}" "AnyKernel3/${{ steps.kimg.outputs.name }}"

          ZIP="rosemary-ksu-susfs-$(date +%Y%m%d-%H%M%S).zip"

          ( cd AnyKernel3 && zip -r9 "../$ZIP" . -x '.git*' )
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          unzip -l "$ZIP" | head -20

      - name: Upload paket + kernel mentah + dtbo
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: warn
          path: |
            ${{ env.ZIP }}
            ${{ steps.kimg.outputs.path }}
            ${{ steps.kimg.outputs.dtbo }}
            kernel-src/out/resolved-config.txt
